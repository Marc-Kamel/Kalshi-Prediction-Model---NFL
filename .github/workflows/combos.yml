name: combos

on:
  workflow_dispatch:
    inputs:
      command:
        description: "run = build combos, friend = one big combo his way (needs game), grade = settle past legs/combos, fit-history = refit from game logs"
        type: choice
        options: [run, friend, grade, fit-history]
        default: run
      game:
        description: "Optional matchup code like CHISEA (leave blank for every game in the next 36h)"
        required: false
        default: ""
  schedule:
    # Times are UTC, set for Eastern Standard Time (Nov–Mar). During daylight time
    # (Mar–Nov) subtract 1 hour from each to keep the same ET time.
    - cron: "30 23 * * 4"   # Thu 6:30pm ET  — Thursday night game
    - cron: "45 16 * * 0"   # Sun 11:45am ET — after 1pm inactives (Sunday slate)
    - cron: "45 20 * * 0"   # Sun 3:45pm ET  — late games + SNF
    - cron: "45 0 * * 1"    # Sun 7:45pm ET  — Sunday night game
    - cron: "30 0 * * 2"    # Mon 7:30pm ET  — Monday night game
    - cron: "0 14 * * 2"    # Tue 9:00am ET  — grade last week + refit history

permissions:
  contents: write   # to commit the reports folder

concurrency:
  group: combos
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tests
        env:
          GITHUB_STEP_SUMMARY: ""   # test fixtures must never show up in the run summary
        run: pytest -q
      - name: Pick command
        id: cmd
        run: |
          if [ "${{ github.event.schedule }}" = "0 14 * * 2" ]; then echo "c=weekly" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.command }}" ]; then echo "c=${{ inputs.command }}" >> $GITHUB_OUTPUT
          else echo "c=run" >> $GITHUB_OUTPUT; fi
      - name: Build combos (read-only; never places orders)
        if: steps.cmd.outputs.c == 'run'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -n "${{ inputs.game }}" ]; then
            kalshicombos run --game "${{ inputs.game }}"
          else
            kalshicombos run
          fi
      - name: Friend mode (one big combo, with reality check)
        if: steps.cmd.outputs.c == 'friend'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -z "${{ inputs.game }}" ]; then echo "friend mode needs a game, e.g. PHIWAS" >&2; exit 1; fi
          kalshicombos friend --game "${{ inputs.game }}"
      - name: Grade past legs and combos
        if: steps.cmd.outputs.c == 'grade' || steps.cmd.outputs.c == 'weekly'
        run: |
          kalshicombos grade
          cat reports/grades/summary.md >> $GITHUB_STEP_SUMMARY
      - name: Refit shapes and correlations from game logs
        if: steps.cmd.outputs.c == 'fit-history' || steps.cmd.outputs.c == 'weekly'
        run: kalshicombos fit-history
      - name: Commit reports and model data
        run: |
          git config user.name "combos-bot"
          git config user.email "combos-bot@users.noreply.github.com"
          git add reports data
          git diff --cached --quiet || git commit -m "${{ steps.cmd.outputs.c }}: $(date -u +%Y%m%dT%H%MZ)"
          git pull --rebase -q origin main || true
          git push

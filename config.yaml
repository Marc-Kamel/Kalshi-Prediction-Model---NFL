# kalshicombos configuration. Everything here is safe to tune.
# Scope: PLAYER markets only (no moneyline / spread / total).

odds:
  # The Odds API (https://the-odds-api.com). Put your key in the ODDS_API_KEY
  # environment variable / GitHub secret, never in this file.
  api_key_env: ODDS_API_KEY
  sport: americanfootball_nfl
  # Up to 10 bookmakers cost the same credits as one region. Pinnacle is the
  # sharpest book and gets the most weight below.
  bookmakers: [pinnacle, fanduel, draftkings, betmgm, williamhill_us, betrivers, espnbet, fanatics, betonlineag, bovada]
  # Each market costs 1 credit per game per call (6 here).
  # *_alternate markets (e.g. player_reception_yds_alternate) are supported but OFF: books post
  # them Over-only, so their vig has to be guessed, and on CHI@SEA (Nov 2) no single guess lined
  # up with Kalshi — they produced fake edges. Re-add them only with allow_one_sided_props: true.
  markets:
    - player_receptions
    - player_reception_yds
    - player_rush_yds
    - player_pass_yds
    - player_rush_reception_yds
    - player_anytime_td
  # Weight of each book in the fair-price average (books not listed get 1.0).
  book_weights:
    pinnacle: 3.0
    betonlineag: 1.5
    fanduel: 1.25
    draftkings: 1.25
  min_books: 2                 # need this many books agreeing before trusting a fair price
  # Over-only prices (most alternate lines, Yes-only anytime TD) have their vig removed by
  # assuming the same overround the book charges on its two-sided player lines. If a book
  # has no two-sided lines, these defaults are used.
  one_sided_margin: 0.07       # anytime TD (Yes only)
  one_sided_margin_props: 0.06 # alternate yardage / receptions lines (only if allowed below)
  allow_one_sided_props: false # use Over-only yardage/receptions quotes? (false = two-sided lines only)

kalshi:
  base_url: https://api.elections.kalshi.com/trade-api/v2
  discovery_series: KXNFLGAME  # used only to list this week's games
  series:
    receptions: KXNFLREC
    rec_yds: KXNFLRECYDS
    rush_yds: KXNFLRSHYDS
    pass_yds: KXNFLPASSYDS
    rr_yds: KXNFLRRYDS         # rushing + receiving yards combined
    td: KXNFLTD
  taker_fee_rate: 0.07         # Kalshi taker fee = ceil(rate * C * P * (1-P)) per order

games:
  hours_ahead: 36              # only price games kicking off within this window (saves credits)
  only: []                     # e.g. ["CHISEA"] to force specific games

filters:
  min_kalshi_prob: 0.60        # leg's own Kalshi price (mid) must be >= this
  min_fair_prob: 0.60          # and the sportsbook fair probability must be >= this
  min_edge: 0.005              # fair - (ask + fee) must beat this (half a cent) to count as +EV
  one_sided_buffer: 0.03       # legs priced from Yes-only quotes (most anytime-TD) need this much MORE edge
  max_edge: 0.08               # an "edge" bigger than this on a liquid exchange is almost always a
                               # model/data error (stale line, wrong player) — skip it and flag it
  stake_usd: 10                # used only to compute Kalshi's per-order fee rounding

model:
  # Distribution shape used to price Kalshi rungs ("60+") from a book's line (e.g. O 64.5).
  # Coefficient of variation (sd / mean) per stat, from typical NFL game-to-game spread.
  cv:
    rec_yds: 0.80
    rush_yds: 0.65
    rr_yds: 0.60
    pass_yds: 0.30
  receptions_dispersion: 1.15  # variance / mean for receptions (1.0 = Poisson)
  # Only move a book's line to a Kalshi rung that is close to it: within max(abs, rel × line).
  # Lines below min_line (low-volume players) are used only when the book posts that exact line.
  # (Yards distributions have no "zero catches" mass, so moving far down from a line overstates
  # the chance; moving far up depends on a tail we can't verify. Keep moves small.)
  extrapolation:
    rec_yds:    {abs: 5,  rel: 0.15, min_line: 24.5}
    rush_yds:   {abs: 5,  rel: 0.15, min_line: 24.5}
    rr_yds:     {abs: 5,  rel: 0.15, min_line: 24.5}
    pass_yds:   {abs: 20, rel: 0.08, min_line: 150}
    receptions: {abs: 1,  rel: 0.0,  min_line: 2.5}

combos:
  min_legs: 2
  # Combo sizes to build per game (0 = as many qualifying legs as fit). One combo per size.
  sizes: [3, 5, 8, 12, 20, 0]
  max_legs: 40
  candidates_per_game: 60      # best legs per game considered for combos
  allow_ranges: true           # same player-stat twice as Yes on a low rung + No on a high rung
                               # (e.g. "30+ rushing" and "No 80+ rushing" = 30–79 yards)
  sims: 400000
  min_sim_hits: 300            # stop growing a combo once it wins in fewer simulated games than this
  seed: 7
  accept_margin: 0.03          # only accept a Kalshi combo quote paying >= fair payout * (1 + this)
  # Correlation model (latent factors). Loadings are on: team offense, team pass volume,
  # player's own performance. Rungs of the SAME player stat share one latent exactly.
  # Heuristic starting values; tune once you have results.
  loadings:
    pass_yds:   [0.40, 0.55, 0.35]
    rec_yds:    [0.30, 0.35, 0.60]
    receptions: [0.20, 0.35, 0.60]
    rush_yds:   [0.30, -0.20, 0.60]
    rr_yds:     [0.35, 0.05, 0.70]
    td:         [0.50, 0.00, 0.35]
  game_loading: 0.60           # (unused for player-only runs)
  total_loading: 0.60

output:
  dir: reports

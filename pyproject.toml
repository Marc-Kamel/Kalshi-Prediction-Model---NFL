[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshicombos"
version = "0.1.0"
description = "Find +EV Kalshi NFL legs vs sportsbook no-vig odds and build simulated same-game combos (suggest-only, never trades)."
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
kalshicombos = "kalshicombos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
